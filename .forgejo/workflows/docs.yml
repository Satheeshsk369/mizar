name: Deploy Documentation (Forgejo)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.forgejo/workflows/docs.yml'
  workflow_dispatch:

jobs:
  deploy-gh-pages:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Documentation
        run: |
          make
          MIZAR_DOCS_BASE="/mizar" make doc-build

      - name: Deploy to gh-pages Branch
        uses: https://github.com/peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs
          force_orphan: true

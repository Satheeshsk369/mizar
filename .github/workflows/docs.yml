name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Compiler Packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-gcc14-${{ runner.os }}
          restore-keys: |
            apt-gcc14-${{ runner.os }}

      - name: Setup GCC 14 
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-14 pkg-config make

      - name: Build Mizar & Documentation
        run: |
          make CC=gcc-14
          make doc-build CC=gcc-14

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
